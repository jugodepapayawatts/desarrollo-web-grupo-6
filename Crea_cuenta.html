
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear cuenta - Casino Nova</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
    <h1>Crear una cuenta</h1>

  <form id="formulario_cuenta">


       <label for="nombre">Nombre:</label>
       <input type="text" id="nombre" name="nombre"
       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
       title="Solo se permiten letras"
       required>
       <br><br>

       <label for="apellido">Apellido:</label>
       <input type="text" id="apellido" name="apellido"
       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]+"
       title="Solo se permiten letras"
       required>
       <br><br>


      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo"
      name="correo" required>
      <br><br>

      <label for="usuario">Nombre de usuario:</label>
      <input type="text" id="usuario"
      name="usuario" minlength="3" maxlength="20" required>
      <br><br>

      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena"
      name="contrasena" minlength="8" required>
      <br><br>

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha"
      name="fecha" required>
      <br><br>

      <label for="genero">Género</label>
      <select id="genero" name="genero" required>

          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="prefiero no decirlo">Prefiero no decirlo</option>

      </select>

      <br><br>

      <input type="checkbox" id="terminos" name="terminos" required>
      <label for="terminos">Acepto los términos y condiciones</label>

      <br><br>

      <input type="submit" value="Crear cuenta">
      <br><br>

      <p id="aviso_cuenta"></p>

      <a class="boton" href="index.html">Volver al inicio</a>
  </form>


<script>
    document.getElementById("formulario_cuenta").addEventListener("submit", async function(evento) {

        evento.preventDefault();

        const aviso = document.getElementById("aviso_cuenta");
        aviso.textContent = "Creando cuenta...";

        const datos = {
            nombre: document.getElementById("nombre").value.trim(),
            apellido: document.getElementById("apellido").value.trim(),
            correo: document.getElementById("correo").value.trim(),
            usuario: document.getElementById("usuario").value.trim(),
            contrasena: document.getElementById("contrasena").value
        };

        try {
            const respuesta = await fetch("/api/registro", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();

            if (!respuesta.ok) {
                aviso.textContent = resultado.error || "Error al crear cuenta";
                return;
            }

            aviso.textContent = "Cuenta creada correctamente. Ya puedes iniciar sesión.";
            document.getElementById("formulario_cuenta").reset();

        } catch (error) {
            aviso.textContent = "No se pudo conectar con el servidor.";
            console.error(error);
        }

    });
</script>


    </body>
</html>
