
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicia sesión - Casino Nova</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>

    <h1>Inicio de sesión (jugadores)</h1>

    <form id="formulario_login">

        <label for="usuario_login">Usuario:</label>

        <input type="text" id="usuario_login" name="usuario_login" required>

        <br><br>

        <label for="clave_login">Contraseña:</label>

        <input type="password" id="clave_login" name="clave_login" required>

        <br><br>

        <input type="submit" value="Ingresar">

        <p id="aviso_login"></p>

        <br><br>

        <a class="boton" href="index.html">Volver al inicio</a>

    </form>

    <script>
        document.getElementById("formulario_login").addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const usuario = document.getElementById("usuario_login").value.trim();
            const contrasena = document.getElementById("clave_login").value;
            const aviso = document.getElementById("aviso_login");

            if (usuario === "" || contrasena === "") {
                aviso.textContent = "Ingresa tu usuario y contraseña.";
                return;
            }

            aviso.textContent = "Iniciando sesión...";

            try {
                const respuesta = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuario,
                        contrasena: contrasena
                    })
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    aviso.textContent = resultado.error || "Error al iniciar sesión.";
                    return;
                }

                sessionStorage.setItem("casinoToken", resultado.token);
                sessionStorage.setItem("usuarioCasino", resultado.usuario.usuario);

                window.location.href = "Perfil.html";

            } catch (error) {
                aviso.textContent = "No se pudo conectar con el servidor.";
                console.error(error);
            }

        });
    </script>

    </body>
</html>
