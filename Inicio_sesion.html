<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicia sesión - Casino Nova</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>

    <div class="panel" id="login">

    <h1>Inicio de sesión (jugadores)</h1>

    <form id="formulario_login">

        <label for="usuario_login">Usuario:</label>

        <input type="text" id="usuario_login" name="usuario_login" required>

        <br><br>

        <label for="clave_login">Contraseña:</label>

        <input type="password" id="clave_login" name="clave_login" required>

        <br><br>

        <input type="submit" value="Ingresar">

        <p id="aviso_login"></p>

    </form>

    <br><br>

    <a class="boton" href="index.html">Volver al inicio</a>

    </div>

    <script>
        document.getElementById("formulario_login").addEventListener("submit", function(evento) {

            evento.preventDefault();

            const usuario = document.getElementById("usuario_login").value.trim();

            if (usuario === "") {
                document.getElementById("aviso_login").textContent = "Ingresa tu nombre de usuario.";
                return;
            }

            sessionStorage.setItem("usuarioCasino", usuario);

            window.location.href = "Perfil.html";

        });
    </script>

    </body>
</html>
