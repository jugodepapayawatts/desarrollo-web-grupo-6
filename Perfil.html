
<!DOCTYPE html>
<html>
    <head>
        <title> Juegos -Casino Nova </title>
       <link rel="stylesheet" href="styles.css" /> 

    </head>
    <body>
       
  <div class="panel" id="perfil"> 

    <h2>Perfil del jugador</h2>    
    <p>Usuario: <span id="nombre_usuario">Invitado</span></p>
    <p>Saldo: <span id="saldo">0</span> creditos</p>

    <h3>Actividad reciente</h3> 
    <p>Ultima actividad: <span id="ultima_actividad">Ninguna</span></p> 
    <p>Partidas realizadas: <span id="partidas_realizadas">0</span></p> 

    <h3>Estadisticas</h3> 
    <p>Partidas totales: <span id="partidas_jugadas">0</span></p> 
    <p>Partidas ganadas: <span id="partidas_ganadas">0</span></p> 
    <p>Partidas perdidas: <span id="partidas_perdidas">0</span></p> 

    <h3>Volver</h3> 
    <a class="boton" href="Juego.html" class="boton_inicio">Ver juegos</a> 
    <a class="boton" href="index.html" class="boton_inicio">Inicio</a> 

  </div> 

    <script src="Saldo.js"></script>
    <script>
      //actualizar saldo
      function actualizarSaldoPerfil() {
        document.getElementById("saldo").textContent = obtenerSaldo();
      }

      window.addEventListener("pageshow", actualizarSaldoPerfil);
      window.addEventListener("storage", function(evento) {
        if (evento.key === "casinoSaldo" || evento.key === null) {
          actualizarSaldoPerfil();
        }
      });

      actualizarSaldoPerfil();
      //actualizar estadisticas
      const estadisticas=obtenerEstadisticas();
      document.getElementById("ultima_actividad").textContent=estadisticas.ultimaActividad;
      document.getElementById("partidas_realizadas").textContent=estadisticas.partidasJugadas;
      document.getElementById("partidas_jugadas").textContent=estadisticas.partidasJugadas;
      document.getElementById("partidas_ganadas").textContent=estadisticas.partidasGanadas;
      document.getElementById("partidas_perdidas").textContent=estadisticas.partidasPerdidas;

      
      const usuarioGuardado = sessionStorage.getItem("usuarioCasino");
      if (usuarioGuardado !== null) {
      document.getElementById("nombre_usuario").textContent = usuarioGuardado;
    }

    </script>
    </body>
</html>
