
<!DOCTYPE html>
<html>
    <head>
        <title> Juegos -Casino Nova </title>
       <link rel="stylesheet" href="styles.css" /> 

    </head>
    <body>
       
  <div class="panel" id="perfil"> 

    <h2>Perfil del jugador</h2>    
    <p>Usuario: <span id="nombre_usuario">Invitado</span></p>
    <p>Saldo: <span id="saldo">0</span> créditos virtuales</p>

    <h3>Actividad reciente</h3> 
    <p>Ultima actividad: <span id="ultima_actividad">Ninguna</span></p> 
    <p>Partidas realizadas: <span id="partidas_realizadas">0</span></p> 

    <h3>Estadisticas</h3> 
    <p>Partidas totales: <span id="partidas_jugadas">0</span></p> 
    <p>Partidas ganadas: <span id="partidas_ganadas">0</span></p> 
    <p>Partidas perdidas: <span id="partidas_perdidas">0</span></p> 

    <h3>Volver</h3> 
    <a class="boton" href="Juego.html" class="boton_inicio">Ver juegos</a> 
    <a class="boton" href="index.html" class="boton_inicio">Inicio</a> 

  </div> 

    <script>
      async function cargarPerfil() {
        const token = sessionStorage.getItem("casinoToken");

        if (!token) {
          window.location.href = "Inicio_sesion.html";
          return;
        }

        try {
          const respuesta = await fetch("/api/perfil", {
            headers: {
              "Authorization": "Bearer " + token
            }
          });

          if (!respuesta.ok) {
            sessionStorage.removeItem("casinoToken");
            sessionStorage.removeItem("usuarioCasino");
            window.location.href = "Inicio_sesion.html";
            return;
          }

          const datos = await respuesta.json();
          const usuario = datos.usuario;

          document.getElementById("nombre_usuario").textContent = usuario.usuario;
          document.getElementById("saldo").textContent = usuario.saldo;

          // Las estadísticas se conectarán posteriormente
          document.getElementById("ultima_actividad").textContent = "Ninguna";
          document.getElementById("partidas_realizadas").textContent = "0";
          document.getElementById("partidas_jugadas").textContent = "0";
          document.getElementById("partidas_ganadas").textContent = "0";
          document.getElementById("partidas_perdidas").textContent = "0";

        } catch (error) {
          console.error("Error al cargar perfil:", error);
        }
      }

      window.addEventListener("pageshow", cargarPerfil);
    </script>
    </body>
</html>
